<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShoeperCling.SC — Foto Sepatu Masuk</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<div class="wrap" id="loginScreen">
  <header class="brand">
    <div class="logo-circle">
      <img src="logo.png" alt="ShoeperCling.SC" style="width:100%;height:100%;object-fit:cover;border-radius:999px;" />
    </div>
    <div>
      <p class="eyebrow">ShoeperCling.SC · Admin</p>
      <h1>Masuk Halaman Admin</h1>
    </div>
  </header>
  <div class="card">
    <label for="adminPass">Password staff</label>
    <input type="password" id="adminPass" placeholder="Masukkan password" />
    <p id="loginError" class="error-text" style="display:none;">Password salah, coba lagi.</p>
    <button class="primary" id="loginBtn">Masuk</button>
  </div>
</div>

<div class="wrap" id="adminScreen" style="display:none;">
  <header class="brand">
    <div class="logo-circle">
      <img src="logo.png" alt="ShoeperCling.SC" style="width:100%;height:100%;object-fit:cover;border-radius:999px;" />
    </div>
    <div>
      <p class="eyebrow">ShoeperCling.SC · Intake</p>
      <h1>Foto Sepatu Masuk</h1>
    </div>
  </header>

  <a href="riwayat.html" class="back-link" style="margin-bottom:20px;">Lihat riwayat tiket &rsaquo;</a>

  <div class="card">
    <label for="nama">Nama customer</label>
    <input type="text" id="nama" placeholder="cth. Rangga" />
    <label for="kode">Kode / nomor tiket</label>
    <input type="text" id="kode" placeholder="cth. SC-0231" />
    <label for="tanggal">Tanggal sepatu masuk</label>
    <input type="date" id="tanggal" />
  </div>

  <div id="shoeBlocks"></div>

  <button type="button" id="addShoeBtn" class="secondary" style="margin-bottom:20px;">
    + Tambah pasang sepatu
  </button>

  <p id="errorText" class="error-text" style="display:none;"></p>

  <button class="primary" id="submitBtn">Simpan & buat link tiket</button>
  <p class="help-text">Link tiket bisa dibuka siapa saja yang menerima link — jangan sertakan data pribadi sensitif di catatan.</p>

  <div id="resultCard" class="card" style="display:none; margin-top:20px;">
    <p class="section-label" style="margin-bottom:10px;">Tiket berhasil disimpan</p>
    <div id="resultLinkBox" style="background:#F3FAFE; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--text); word-break:break-all; margin-bottom:12px;"></div>
    <button class="secondary" id="shareResultBtn">Bagikan link tiket</button>
    <button class="primary" id="newTicketBtn" style="margin-top:10px;">+ Buat tiket baru</button>
  </div>
</div>

<script>
// ============ Gerbang password admin ============
const ADMIN_PASSWORD = "cleanshoes"; // ganti sendiri kapan saja

const loginScreen = document.getElementById("loginScreen");
const adminScreen = document.getElementById("adminScreen");

if (sessionStorage.getItem("sc_admin_ok") === "1") {
  loginScreen.style.display = "none";
  adminScreen.style.display = "block";
}

document.getElementById("loginBtn").addEventListener("click", tryLogin);
document.getElementById("adminPass").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryLogin();
});

function tryLogin() {
  const input = document.getElementById("adminPass").value;
  if (input === ADMIN_PASSWORD) {
    sessionStorage.setItem("sc_admin_ok", "1");
    loginScreen.style.display = "none";
    adminScreen.style.display = "block";
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}
// ============ Selesai gerbang password ============

const ANGLES = ["Atas (pasangan)", "Samping kiri", "Samping kanan", "Sol / alas", "Dalam sepatu", "Label / merk"];
let shoeCounter = 0;
const shoes = {}; // shoeId -> { label: string, photos: {angle: Blob} }

// kompres foto sebelum diupload — resize max 1600px & kualitas JPEG 75%
function compressImage(file, maxDim = 1600, quality = 0.75) {
  return new Promise((resolve) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => { img.src = e.target.result; };
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxDim) {
        height = Math.round(height * (maxDim / width));
        width = maxDim;
      } else if (height > maxDim) {
        width = Math.round(width * (maxDim / height));
        height = maxDim;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob) => resolve(blob || file), "image/jpeg", quality);
    };
    img.onerror = () => resolve(file); // gagal kompres, pakai file asli
    reader.readAsDataURL(file);
  });
}

const tanggalInput = document.getElementById("tanggal");
tanggalInput.value = new Date().toISOString().slice(0, 10);

const shoeBlocksEl = document.getElementById("shoeBlocks");

function addShoeBlock() {
  shoeCounter += 1;
  const shoeId = `shoe-${shoeCounter}`;
  shoes[shoeId] = { label: "", photos: {} };

  const block = document.createElement("div");
  block.className = "card";
  block.dataset.shoeId = shoeId;
  block.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <p class="section-label" style="margin:0;">Sepatu #${shoeCounter}</p>
      ${shoeCounter > 1 ? `<button type="button" class="remove-shoe-btn" style="background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;">Hapus</button>` : ""}
    </div>
    <label>Nama / jenis sepatu (opsional)</label>
    <input type="text" class="shoe-label-input" placeholder="cth. Vans merah" />
    <div class="photo-grid shoe-photo-grid" style="margin-bottom:0;"></div>
  `;
  shoeBlocksEl.appendChild(block);

  const labelInput = block.querySelector(".shoe-label-input");
  labelInput.addEventListener("input", () => {
    shoes[shoeId].label = labelInput.value.trim();
  });

  const grid = block.querySelector(".shoe-photo-grid");
  ANGLES.forEach((angle) => {
    const slot = document.createElement("div");
    slot.className = "photo-slot";
    slot.innerHTML = `
      <input type="file" accept="image/*" capture="environment" />
      <div class="placeholder">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E8BC0" stroke-width="1.8"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2"/></svg>
        <span>${angle}</span>
      </div>
    `;
    const input = slot.querySelector("input");
    slot.addEventListener("click", () => input.click());
    input.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      slot.innerHTML = `<div class="placeholder"><span>Memproses…</span></div>`;
      const compressed = await compressImage(file);
      shoes[shoeId].photos[angle] = compressed;
      const reader = new FileReader();
      reader.onload = () => {
        slot.innerHTML = `
          <img src="${reader.result}" alt="${angle}" />
          <span class="tag">${angle}</span>
          <button class="remove" type="button">×</button>
        `;
        slot.querySelector(".remove").addEventListener("click", (ev) => {
          ev.stopPropagation();
          delete shoes[shoeId].photos[angle];
          rebuildEmptySlot(slot, angle, shoeId);
        });
      };
      reader.readAsDataURL(compressed);
    });
    grid.appendChild(slot);
  });

  const removeBtn = block.querySelector(".remove-shoe-btn");
  if (removeBtn) {
    removeBtn.addEventListener("click", () => {
      delete shoes[shoeId];
      block.remove();
    });
  }
}

function rebuildEmptySlot(slot, angle, shoeId) {
  slot.innerHTML = `
    <input type="file" accept="image/*" capture="environment" />
    <div class="placeholder">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2E8BC0" stroke-width="1.8"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2"/></svg>
      <span>${angle}</span>
    </div>
  `;
  const input = slot.querySelector("input");
  slot.onclick = () => input.click();
  input.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    slot.innerHTML = `<div class="placeholder"><span>Memproses…</span></div>`;
    const compressed = await compressImage(file);
    shoes[shoeId].photos[angle] = compressed;
    const reader = new FileReader();
    reader.onload = () => {
      slot.innerHTML = `
        <img src="${reader.result}" alt="${angle}" />
        <span class="tag">${angle}</span>
        <button class="remove" type="button">×</button>
      `;
      slot.querySelector(".remove").addEventListener("click", (ev) => {
        ev.stopPropagation();
        delete shoes[shoeId].photos[angle];
        rebuildEmptySlot(slot, angle, shoeId);
      });
    };
    reader.readAsDataURL(compressed);
  });
}

document.getElementById("addShoeBtn").addEventListener("click", addShoeBlock);
addShoeBlock(); // mulai dengan 1 blok sepatu

function genId() {
  const rand = Math.random().toString(36).slice(2, 10);
  const ts = Date.now().toString(36);
  return `${ts}${rand}`;
}

function showError(msg) {
  const el = document.getElementById("errorText");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  showError("");
  const shoeIds = Object.keys(shoes);
  const totalPhotos = shoeIds.reduce((sum, id) => sum + Object.keys(shoes[id].photos).length, 0);
  if (totalPhotos === 0) {
    showError("Tambahkan minimal 1 foto sebelum menyimpan.");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "Mengunggah foto…";

  try {
    const id = genId();
    const namaCustomer = document.getElementById("nama").value.trim() || "Tanpa nama";
    const kodeSepatu = document.getElementById("kode").value.trim() || "-";
    const tanggalMasuk = document.getElementById("tanggal").value || null;

    // 1. insert tiket
    const { error: ticketErr } = await supabaseClient
      .from("tickets")
      .insert({ id, nama_customer: namaCustomer, kode_sepatu: kodeSepatu, tanggal_masuk: tanggalMasuk });
    if (ticketErr) throw ticketErr;

    // 2. upload semua foto secara paralel (bareng-bareng, bukan satu-satu)
    let shoeIndex = 0;
    const uploadTasks = [];
    for (const shoeId of shoeIds) {
      shoeIndex += 1;
      const shoe = shoes[shoeId];
      const namaSepatu = shoe.label || `Sepatu ${shoeIndex}`;
      const angles = Object.keys(shoe.photos);

      for (const angle of angles) {
        const file = shoe.photos[angle];
        const path = `${id}/${shoeId}-${angle.replace(/[^a-z0-9]/gi, "-")}-${Date.now()}.jpg`;

        const task = supabaseClient.storage
          .from("foto-sepatu")
          .upload(path, file)
          .then(({ error: uploadErr }) => {
            if (uploadErr) throw uploadErr;
            const { data: publicUrlData } = supabaseClient.storage
              .from("foto-sepatu")
              .getPublicUrl(path);
            return supabaseClient
              .from("photos")
              .insert({ ticket_id: id, angle, url_foto: publicUrlData.publicUrl, nama_sepatu: namaSepatu });
          })
          .then(({ error: photoErr }) => {
            if (photoErr) throw photoErr;
          });

        uploadTasks.push(task);
      }
    }
    await Promise.all(uploadTasks);

    // 3. tampilkan hasil + tombol share di halaman yang sama
    const ticketUrl = `${window.location.origin}${window.location.pathname.replace("index.html", "")}lihat-sepatu.html?id=${id}`;
    document.getElementById("resultLinkBox").textContent = ticketUrl;
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("resultCard").scrollIntoView({ behavior: "smooth" });

    btn.disabled = false;
    btn.textContent = "Simpan & buat link tiket";

    const shareBtn = document.getElementById("shareResultBtn");
    const shareData = {
      title: "ShoeperCling.SC — Foto Sepatu Masuk",
      text: `Foto sepatu masuk untuk ${namaCustomer} (${kodeSepatu})`,
      url: ticketUrl,
    };
    shareBtn.onclick = async () => {
      if (navigator.share) {
        try {
          await navigator.share(shareData);
          return;
        } catch (e) {
          return;
        }
      }
      navigator.clipboard.writeText(ticketUrl).then(() => {
        shareBtn.textContent = "Link disalin ✓";
        setTimeout(() => (shareBtn.textContent = "Bagikan link tiket"), 1600);
      });
    };
    document.getElementById("newTicketBtn").onclick = () => {
      window.location.reload();
    };
  } catch (e) {
    console.error(e);
    showError("Gagal menyimpan: " + (e.message || "coba lagi."));
    btn.disabled = false;
    btn.textContent = "Simpan & buat link tiket";
  }
});
</script>
</body>
</html>
