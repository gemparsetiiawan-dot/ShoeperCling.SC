<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShoeperCling.SC — Foto Sepatu Masuk</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">&larr; Buat tiket baru</a>
  <div id="content">
    <div class="state-center">
      <div class="spinner"></div>
      <p>Memuat foto…</p>
    </div>
  </div>
</div>

<script>
function dots(flip) {
  const spans = new Array(24).fill('<span></span>').join("");
  return `<div class="ticket-dots${flip ? " flip" : ""}">${spans}</div>`;
}

async function load() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const content = document.getElementById("content");

  if (!id) {
    content.innerHTML = `<div class="state-center"><h2>Link tidak valid</h2><p>ID tiket tidak ditemukan di URL.</p></div>`;
    return;
  }

  try {
    const { data: ticket, error: ticketErr } = await supabaseClient
      .from("tickets")
      .select("*")
      .eq("id", id)
      .single();
    if (ticketErr || !ticket) throw new Error("not found");

    const { data: photos, error: photoErr } = await supabaseClient
      .from("photos")
      .select("*")
      .eq("ticket_id", id)
      .order("created_at", { ascending: true });
    if (photoErr) throw photoErr;

    const tanggal = new Date(ticket.created_at).toLocaleString("id-ID", {
      dateStyle: "long",
      timeStyle: "short",
    });
    const tanggalMasuk = ticket.tanggal_masuk
      ? new Date(ticket.tanggal_masuk + "T00:00:00").toLocaleDateString("id-ID", { dateStyle: "long" })
      : null;

    // kelompokkan foto per nama_sepatu
    const groups = {};
    const groupOrder = [];
    photos.forEach((p) => {
      const key = p.nama_sepatu || "Sepatu";
      if (!groups[key]) {
        groups[key] = [];
        groupOrder.push(key);
      }
      groups[key].push(p);
    });

    const groupsHtml = groupOrder.map((label) => `
      <p class="section-label" style="margin-top:24px;">${escapeHtml(label)}</p>
      <div class="view-grid" style="margin-top:0;">
        ${groups[label].map(p => `
          <figure>
            <img src="${p.url_foto}" alt="${escapeHtml(p.angle || "")}" loading="lazy" />
            <figcaption>${escapeHtml(p.angle || "")}</figcaption>
          </figure>
        `).join("")}
      </div>
    `).join("");

    content.innerHTML = `
      <header class="brand" style="flex-direction:column; text-align:center;">
        <div class="logo-circle" style="width:56px;height:56px;margin-bottom:8px;">
          <img src="logo.png" alt="ShoeperCling.SC" style="width:100%;height:100%;object-fit:cover;border-radius:999px;" />
        </div>
        <h1>Foto Sepatu Masuk</h1>
        <p class="eyebrow" style="margin-top:4px;">Bukti kondisi sebelum dicuci</p>
      </header>

      ${dots(false)}
      <div class="ticket-info">
        <div>
          <p class="k">Customer</p>
          <p class="v">${escapeHtml(ticket.nama_customer)}</p>
        </div>
        <div>
          <p class="k">Kode tiket</p>
          <p class="v" style="font-family:monospace;">${escapeHtml(ticket.kode_sepatu)}</p>
        </div>
        ${tanggalMasuk ? `
        <div class="full">
          <p class="k">Tanggal masuk</p>
          <p class="v">${tanggalMasuk}</p>
        </div>` : ""}
        <div class="full">
          <p class="k">Jumlah pasang</p>
          <p class="v">${groupOrder.length} pasang</p>
        </div>
      </div>
      ${dots(true)}

      ${groupsHtml}

      ${photos.length === 0 ? `<p class="help-text">Belum ada foto untuk tiket ini.</p>` : ""}

      <button class="secondary" id="copyBtn" style="margin-top:24px;">Salin link tiket ini</button>
    `;

    document.getElementById("copyBtn").addEventListener("click", () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.textContent = "Link disalin ✓";
        setTimeout(() => (btn.textContent = "Salin link tiket ini"), 1600);
      });
    });
  } catch (e) {
    console.error(e);
    content.innerHTML = `<div class="state-center"><h2>Tiket tidak ditemukan</h2><p>Link mungkin salah atau tiket sudah dihapus.</p></div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

load();
</script>
</body>
</html>
